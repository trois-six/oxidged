[package]
name = "oxidged-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for oxidged (not part of the crate's build)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxidged = { path = "..", features = ["serde", "gedzip", "calendar"] }
serde_json = "1.0"

# A stand-alone workspace, so the crate's own builds never see this package.
[workspace]
members = ["."]

[[bin]]
name = "entry_points"
path = "fuzz_targets/entry_points.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writer"
path = "fuzz_targets/writer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spec"
path = "fuzz_targets/spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "editing"
path = "fuzz_targets/editing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profiles"
path = "fuzz_targets/profiles.rs"
test = false
doc = false
bench = false
