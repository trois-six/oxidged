# Long-running checks that do not gate pull requests: fuzzing, the opt-in
# conformance corpora (fetched from pinned commits, never vendored), the
# beta and nightly toolchains, and Windows and macOS.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # A scheduled run runs only when the branch moved since the previous run
  # of this workflow, cancelled ones aside: the same commit would test the
  # same code again. A run on demand always runs.
  changes:
    name: Changes since the last run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
      - name: Compare with the previous run's commit
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")][0].head_sha // empty")
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Nothing changed since the previous run, at $last: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: Fuzz every target
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    # Built here rather than installed prebuilt: the only Linux release of
    # cargo-fuzz is a musl binary, which builds the targets for musl by
    # default, where the sanitizer cannot run.
    - name: Install cargo-fuzz
      run: |
        cargo install cargo-fuzz --locked
        cargo fuzz --version

    - name: Seed the corpora with the test fixtures
      run: |
        for target in entry_points tree writer spec model convert editing profiles; do
          mkdir -p fuzz/corpus/$target
          find tests/fixtures -name '*.ged' -size -64k -exec cp {} fuzz/corpus/$target/ \;
        done
        # The producers' fixtures (the first byte chooses a profile).
        find tests/profiles/fixtures -name '*.ged' -exec cp {} fuzz/corpus/profiles/ \;

    - name: Fuzz the entry points for five minutes
      run: cargo fuzz run entry_points -- -max_total_time=300 -max_len=65536

    - name: Fuzz the decoder and the lexer for five minutes
      run: cargo fuzz run tree -- -max_total_time=300 -max_len=65536

    - name: Fuzz the writer (conformant lines, output re-parses) for five minutes
      run: cargo fuzz run writer -- -max_total_time=300 -max_len=65536

    - name: Fuzz the validator and the conformance repair for five minutes
      run: cargo fuzz run spec -- -max_total_time=300 -max_len=65536

    - name: Fuzz the typed model under construction for five minutes
      run: cargo fuzz run model -- -max_total_time=300 -max_len=65536

    - name: Fuzz the conversion between 5.5.1 and 7.x for five minutes
      run: cargo fuzz run convert -- -max_total_time=300 -max_len=65536

    - name: Fuzz edit sequences (counts, lookups, dangling pointers, writes) for five minutes
      run: cargo fuzz run editing -- -max_total_time=300 -max_len=65536

    - name: Fuzz producer profiles (interpretation and every export, conformant and idempotent) for five minutes
      run: cargo fuzz run profiles -- -max_total_time=300 -max_len=20000

    - name: The repair's property over the fuzz corpus
      run: FUZZ_CORPUS=fuzz/corpus cargo test --test spec_conform -- --ignored every_fuzz_input

    - name: Keep the crashing inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts
        path: fuzz/artifacts/

  # The next Rust releases, weeks before a new lint or a change breaks the
  # stable toolchain ci.yml tests on each commit.
  toolchains:
    name: Test Suite (${{ matrix.rust }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, nightly]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Run clippy
      run: |
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo clippy -p oxidged --all-targets --no-default-features -- -D warnings

    - name: Run tests
      run: |
        cargo nextest run --workspace --all-features
        cargo test --workspace --all-features --doc

  # Windows and macOS, which ci.yml runs on a tag or on demand only.
  platforms:
    name: Cross Platform Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Build
      run: cargo build --workspace --release

    - name: Run tests
      run: |
        cargo nextest run --workspace --release
        cargo test --workspace --release --doc

  corpora:
    name: Conformance corpora (opt-in tier)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Fetch the pinned corpora and specification inputs
      run: tools/fetch-corpora.sh --registries

    # The performance smoke test measures throughput: it runs in a release
    # build below, not in this debug one.
    - name: Run the opt-in conformance tests
      run: cargo test --all-features --test conformance -- --ignored --skip performance_smoke

    - name: Validate and repair every corpus file (spec)
      run: cargo test --all-features --test spec_armidale --test spec_conform -- --ignored --skip every_fuzz_input

    - name: Performance smoke test
      run: cargo test --release --all-features --test conformance -- --ignored performance
