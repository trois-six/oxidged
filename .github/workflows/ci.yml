# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The jobs read the repository; the release job asks for more on its own.
permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path fuzz/Cargo.toml -- --check
        cargo fmt --manifest-path tools/perf/Cargo.toml -- --check
        cargo fmt --manifest-path tools/differential/Cargo.toml -- --check

    - name: Run clippy
      run: |
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo clippy -p oxidged --all-targets --no-default-features -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --verbose

    - name: Check the documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features


  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests at the minimum supported Rust version
      run: cargo test --workspace --all-features

  features:
    name: Each feature alone
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-hack-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build and test each feature on its own, and none
      run: cargo hack test --workspace --each-feature

  cross-platform-test:
    name: Cross Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --workspace --release --verbose

    - name: Run tests
      run: cargo test --workspace --release --verbose

  memory:
    name: Peak memory and throughput (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/perf/target
        key: ${{ runner.os }}-perf-cargo-${{ hashFiles('**/Cargo.lock', 'tools/perf/Cargo.toml') }}

    - name: Build the performance tool
      run: cargo build --release --manifest-path tools/perf/Cargo.toml

    # Each pipeline runs in a process of its own and reads its peak
    # resident set (VmHWM): a dataset read peaks at most at 3 times the
    # input, its write at 4.5, a stream at 64 MiB; the producer profiles'
    # read, 7.0 write and export are checked against the plain pipelines;
    # see tools/perf.
    - name: Check peak memory and throughput on a generated 47 MB file
      run: |
        perf=tools/perf/target/release/oxidged-perf
        $perf generate 100000 "$RUNNER_TEMP/generated.ged"
        $perf generate 100000 "$RUNNER_TEMP/ftm.ged" ftm
        $perf generate 100000 "$RUNNER_TEMP/paf.ged" paf
        $perf check "$RUNNER_TEMP/generated.ged" ftm="$RUNNER_TEMP/ftm.ged" paf="$RUNNER_TEMP/paf.ged"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    # The advisories of the dependencies the published packages lock
    # (Cargo.lock of the workspace), reported in the log: no check run to
    # create, so the job needs no more than read access.
    - name: Run security audit
      run: cargo audit --deny warnings

  trigger-release:
    name: Trigger Release
    needs: [test, msrv, features, cross-platform-test, memory, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    # The release workflow creates the GitHub release: a called workflow can
    # only get the permissions its caller grants, and GitHub refuses to start
    # the whole run, on every push, when it asks for more.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
