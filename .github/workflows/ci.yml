# .github/workflows/ci.yml
name: CI/CD Pipeline

# Only what a change can break runs: `changes` tells the jobs whether the
# crates (their sources, tests, manifests, the tools and fuzz targets, this
# workflow and the release one) changed, which runs them all, or only the
# documentation, which the crate includes as its rustdoc and tests as such
# (the `docs` job). Anything else (the nightly workflow, editor settings)
# runs nothing. `ci-ok`, the check to require, passes when each job
# succeeded or was skipped. A tag (a release) and a manual run run every
# job. A newer push to the same branch cancels the run in progress.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The jobs read the repository; the release job asks for more on its own.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: dorny/paths-filter@v4
      id: filter
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
      with:
        filters: |
          code:
            - 'src/**'
            - 'tests/**'
            - 'benches/**'
            - 'cli/**'
            - 'fuzz/**'
            - 'tools/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/ci.yml'
            - '.github/workflows/release.yml'
          docs:
            - 'docs/**'
            - '**/*.md'

  test:
    name: Test Suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-

    - name: Check formatting
      run: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path fuzz/Cargo.toml -- --check
        cargo fmt --manifest-path tools/perf/Cargo.toml -- --check
        cargo fmt --manifest-path tools/differential/Cargo.toml -- --check

    - name: Run clippy
      run: |
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo clippy -p oxidged --all-targets --no-default-features -- -D warnings

    # nextest runs the tests of every binary in parallel, each in a process
    # of its own; it runs no doctest, which cargo test runs after.
    - name: Run tests
      run: |
        cargo nextest run --workspace --all-features
        cargo test --workspace --all-features --doc

    - name: Check the documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features


  msrv:
    name: MSRV (1.88)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-msrv-cargo-

    - name: Run tests at the minimum supported Rust version
      run: |
        cargo nextest run --workspace --all-features
        cargo test --workspace --all-features --doc

  # Every feature of the library on its own, and none: cargo-hack's
  # combinations, one per parallel job (`--partition`), run with nextest.
  # All features together are the `test` job's; `default` is empty, and
  # the command line has no feature of its own. A new feature needs one
  # more partition.
  features:
    name: Each feature alone (${{ matrix.partition }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        partition: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-hack and cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack,cargo-nextest

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-hack-${{ matrix.partition }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-hack-${{ matrix.partition }}-cargo-

    - name: Build and test each feature on its own, and none
      run: |
        hack="cargo hack -p oxidged --each-feature --exclude-all-features --exclude-features default --partition ${{ matrix.partition }}/4"
        $hack nextest run
        $hack test --doc

  cross-platform-test:
    name: Cross Platform Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-release-cargo-

    - name: Build
      run: cargo build --workspace --release --verbose

    - name: Run tests
      run: |
        cargo nextest run --workspace --release
        cargo test --workspace --release --doc

  memory:
    name: Peak memory and throughput (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/perf/target
        key: ${{ runner.os }}-perf-cargo-${{ hashFiles('**/Cargo.lock', 'tools/perf/Cargo.toml') }}

    - name: Build the performance tool
      run: cargo build --release --manifest-path tools/perf/Cargo.toml

    # Each pipeline runs in a process of its own and reads its peak
    # resident set (VmHWM): a dataset read peaks at most at 3 times the
    # input, its write at 4.5, a stream at 64 MiB; the producer profiles'
    # read, 7.0 write and export are checked against the plain pipelines;
    # see tools/perf.
    - name: Check peak memory and throughput on a generated 47 MB file
      run: |
        perf=tools/perf/target/release/oxidged-perf
        $perf generate 100000 "$RUNNER_TEMP/generated.ged"
        $perf generate 100000 "$RUNNER_TEMP/ftm.ged" ftm
        $perf generate 100000 "$RUNNER_TEMP/paf.ged" paf
        $perf check "$RUNNER_TEMP/generated.ged" ftm="$RUNNER_TEMP/ftm.ged" paf="$RUNNER_TEMP/paf.ged"

  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    # The advisories of the dependencies the published packages lock
    # (Cargo.lock of the workspace), reported in the log: no check run to
    # create, so the job needs no more than read access.
    - name: Run security audit
      run: cargo audit --deny warnings

  # The documentation alone: `docs/` is the crate's rustdoc (src/lib.rs
  # includes it), its examples are doctests, and tests/docs.rs checks the
  # bundle's format. A change to the crates runs all of this in `test`.
  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-docs-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-docs-cargo-

    - name: Doctests, the bundle's format and the rustdoc
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo test --workspace --all-features --doc
        cargo test --all-features --test docs
        cargo doc --workspace --no-deps --all-features

  trigger-release:
    name: Trigger Release
    needs: [test, msrv, features, cross-platform-test, memory, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    # The release workflow creates the GitHub release: a called workflow can
    # only get the permissions its caller grants, and GitHub refuses to start
    # the whole run, on every push, when it asks for more.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # A skipped job reports "skipped", not "success": requiring the jobs
  # themselves would leave every documentation pull request unmergeable.
  # This one always runs, and passes when each of them either succeeded or
  # was legitimately skipped. Point branch protection at this, not at the
  # jobs it gathers.
  ci-ok:
    name: CI
    if: always()
    needs:
      - changes
      - test
      - docs
      - msrv
      - features
      - cross-platform-test
      - memory
      - security-audit
    runs-on: ubuntu-latest
    steps:
    - name: Verify that nothing failed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "a required job reported '$result'"; exit 1 ;;
          esac
        done
