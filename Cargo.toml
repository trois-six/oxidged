[package]
name = "oxidged"
version = "0.3.2"
authors = [
    "Robert Pirtle <astropirtle@gmail.com>",
    "Jacob Benison <ge3224@gmail.com>",
    "Pierre Erraud <trois.six+github@ik.me>",
    "n4n5 <its.just.n4n5@gmail.com>",
]
description = "A conformant, lenient GEDCOM 5.5.1, 7.0 and 7.1 reader and writer: any file read without loss, strictly conformant output, streaming, GEDZIP, editing and producer profiles"
keywords = ["genealogy", "gedcom", "gedzip", "family-tree", "parser"]
categories = ["parser-implementations", "encoding"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trois-six/oxidged"
homepage = "https://github.com/trois-six/oxidged"
documentation = "https://docs.rs/oxidged"
edition = "2024"
rust-version = "1.88"
include = ["Cargo.toml", "src/**/*.rs", "license.md", "NOTICE", "/README.md", "/docs/*.md"]

[features]
default = []
serde = ["dep:serde"]
gedzip = ["dep:zip"]
calendar = ["dep:calendrical_calculations", "dep:calendrier"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }
calendrical_calculations = { version = "0.2", optional = true }
# `default-features = false` drops calendrier's chrono bridge: its conversions apply a
# Paris-versus-Greenwich clock offset, and we convert through Republican day counts instead.
calendrier = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "read"
harness = false

[[bench]]
name = "write"
harness = false

[[bench]]
name = "memory"
harness = false

[lib]
name = "oxidged"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

# The library and the command-line tool (`cli/`). The fuzz targets and the tools
# are stand-alone packages with workspaces of their own.
[workspace]
members = [".", "cli"]
exclude = ["fuzz", "tools"]
